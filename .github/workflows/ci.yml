name: CI

on:
  push:
    branches: [main, spec-modern-redesign]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check generated data is in sync
        run: |
          bun run build:data
          # Star count is live-fetched data, not derived from patterns/*.md; keep it out of the check.
          git restore apps/web/src/data/github-stars.json
          git add -A apps/web/public README.md
          if ! git diff --cached --exit-code; then
            echo "::error::Generated artifacts under apps/web/public (or the README catalog) do not match patterns/*.md. Run 'npm run build:data' and commit its output together with your pattern change."
            exit 1
          fi

      - name: Build Astro site
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/web/dist
