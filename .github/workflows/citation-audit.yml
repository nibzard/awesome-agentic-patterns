name: Citation Audit

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      all_links:
        description: 'Check HTTP liveness for all URLs, not only source: URLs'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Audit citations and links
        run: |
          args=(--report citation-audit-report.md)
          if [ "${{ inputs.all_links }}" = "true" ]; then
            args+=(--all-links)
          fi
          bun run audit:citations "${args[@]}"

      - name: Write report to job summary
        if: always()
        run: |
          if [ -f citation-audit-report.md ]; then
            cat citation-audit-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The audit produced no report; check the previous step's logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-audit-report
          path: citation-audit-report.md
